[package]
name = "rust_webgl_example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.86"
js-sys = "0.3"
wasm-bindgen-futures = "0.4.50"
[dependencies.web-sys]
version = "0.3"
features = [
  "Document", 
  "Window", 
  "HtmlCanvasElement",
  "WebGlRenderingContext", 
  "WebGl2RenderingContext", 
  "WebGlProgram", 
  "WebGlShader", 
  "WebGlBuffer", 
  "WebGlUniformLocation",
  "Request",
  "RequestInit",
  "Response",
  "RequestMode",
  "console",
]
